<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Expense Approval</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<nav class="topbar" aria-label="App navigation"><a class="wordmark" href="/">Expense ledger</a>
<div id="account-panel" class="account-nav" hidden>
<span id="account-status" role="status"></span><a id="login" href="/login.html">Sign in</a>
<a id="signup-link" class="button" href="/signup.html">Create account</a>
<form id="logout" action="/logout" method="post" hidden><input type="hidden" name="_csrf"><button>Sign out</button></form></div></nav>
<header class="hero"><h1>Team Expense Approval</h1><p>Submit expenses, review assigned claims, and track decisions.</p></header>
<p id="startup-status" role="status"></p>
<section id="claims-app" hidden>
<div class="section-head"><h2>Claims ledger</h2><span id="preview-label" class="sample-tag" hidden>Sample claims</span></div>
<p id="preview-note" hidden>Filter the sample ledger below. Sign in to submit and review real claims.</p>
<label id="demo-account">Demo account <select id="actor"><option value="employee">Employee 1</option><option value="employee2">Employee 2</option><option value="manager">Manager</option></select></label>
<label>Status <select id="filter"><option value="">All claims</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>WITHDRAWN</option></select></label>
<form id="claim" class="claim-entry" hidden><h3>New expense</h3><label>Description <input name="description" required maxlength="255" placeholder="e.g. Train fare"></label>
<label>Amount in EUR <input name="amount" type="number" step="0.01" min="0.01" max="9999999999.99" required placeholder="32.40"></label>
<label id="reviewer-field" hidden>Reviewer username <input name="reviewer" disabled maxlength="40" aria-describedby="reviewer-help"><small id="reviewer-help">Enter the username of another person who already has an account in this app.</small></label>
<button>Submit as employee</button></form>
<p id="status" role="status"></p><section id="claims" aria-label="Claims"></section>
</section></main><script src="/account.js"></script><script src="/demo.js"></script></body></html>
