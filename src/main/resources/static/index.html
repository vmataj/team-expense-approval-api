<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Team Expense Approval</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<p class="eyebrow">OPERATIONS · FINANCE</p><h1>Team Expense Approval</h1>
<p>Submit expenses, review claims, and inspect the audit history.</p>
<label>Demo account <select id="actor"><option value="employee">Employee 1</option><option value="employee2">Employee 2</option><option value="manager">Manager</option></select></label>
<label>Status <select id="filter"><option value="">All claims</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>WITHDRAWN</option></select></label>
<form id="claim"><label>Description <input name="description" required maxlength="255" value="Train fare"></label>
<label>Amount in EUR <input name="amount" type="number" step="0.01" min="0.01" max="9999999999.99" required value="32.40"></label>
<button>Submit as employee</button></form>
<p id="status" role="status"></p><section id="claims" aria-label="Claims"></section>
</main><script src="/demo.js"></script></body></html>
